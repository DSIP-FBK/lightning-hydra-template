[project]
name = "lightning-hydra-template-rishabhW"
version = "1.0.0"
description = "My fork of the lightning hydra template"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.7",
    "hydra-optuna-sweeper>=1.3.0",
    "hydra-submitit-launcher>=1.2.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "lightning>=2.6.6",
    "loguru>=0.7.3",
    "mlflow>=3.16.1",
    "nbformat>=5.11.1",
    "plotly[express]>=7.1.0",
    "polars>=1.44.2",
    "rich>=15.0.0",
    "rootutils>=1.0.7",
    "ruff>=0.16.9",
    "sh>=2.4.0",
    # 2.0 is not supported because hydra-optuna-sweeper was last published in 2023 ☠️☠️☠️
    # https://github.com/optuna/optuna/discussions/4294#discussioncomment-4601610
    "sqlalchemy==1.4.46",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "ty>=0.0.84",
]

[tool.ruff]
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["PLR0913", "ERA001", "E402", "CPY001"]
unfixable = ["F401", "T201", "F841", "RUF059"]